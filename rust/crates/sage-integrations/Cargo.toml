[package]
name = "sage-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "External-boundary traits + impls (Google, Slack, Notion, crypto, Sampler) for sage."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sage-domain = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
# crypto (Phase 2b): byte-compatible with the TS encryption-service
# (AES-256-GCM, 16-byte IV, scrypt N=16384/r=8/p=1, hex salt:iv:authTag:ct) + PKCE S256.
aes-gcm = "0.10"
scrypt = "0.11"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
dirs = "5"
chrono = { workspace = true }
# Google/Slack REST over reqwest (rustls, no system OpenSSL). OAuth is hand-rolled
# form-POSTs (PKCE from this crate); the googleapis/oauth2 crates are not needed.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Phase 2e: rmcp client + transport-child-process (Notion MCP server spawn).

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
